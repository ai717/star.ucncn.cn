# ==============================================================================
# 🛰️ 太空偷窥局 (Space Peep Bureau - SPB) - star.ucncn.cn
# Nginx Production Configuration Specification (Zero-Backend Serverless)
# ==============================================================================

# HTTP -> HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name star.ucncn.cn;

    # Let's Encrypt ACME challenge verification path
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 生产静态站点配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name star.ucncn.cn;

    # 站点静态文件根目录 (按部署环境调整)
    root /var/www/star.ucncn.cn;
    index index.html;

    # SSL 证书配置 (Certbot 或自有证书路径)
    # ssl_certificate /etc/letsencrypt/live/star.ucncn.cn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/star.ucncn.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # 安全响应头
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip 静态资源极速压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 核心页面 index.html (协商缓存，确保发布即时生效)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 静态数据与脚本 (satellites.json, cities.json, js, css)
    location /assets/ {
        # 星历与数据文件缓存 1 小时 (允许自动脚本更新生效)
        location ~* \.json$ {
            add_header Cache-Control "public, max-age=3600";
            add_header Access-Control-Allow-Origin "*";
            try_files $uri =404;
        }

        # JS, CSS, 字体与静态图片长效缓存
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }
    }

    # SPA 单页单应用路由保底
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏敏感及版本管理文件
    location ~ /\.(git|env|DS_Store) {
        deny all;
        return 404;
    }

    # 日志记录
    access_log /var/log/nginx/star.ucncn.cn.access.log;
    error_log /var/log/nginx/star.ucncn.cn.error.log warn;
}
